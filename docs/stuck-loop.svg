<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">
  <rect width="900" height="300" rx="16" fill="#0d1117"/>
  <rect x="40" y="40" width="240" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="160" y="83" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="600">You</text>
  <rect x="620" y="40" width="240" height="70" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="740" y="83" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="600">Your AI assistant</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>
  <path d="M300,140 L600,140" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>
  <text x="450" y="130" text-anchor="middle" fill="#58a6ff">1. paste what your screen says (or the error)</text>
  <path d="M600,190 L300,190" stroke="#3fb950" stroke-width="3" marker-end="url(#b)"/>
  <text x="450" y="215" text-anchor="middle" fill="#3fb950">2. "click this / type that"</text>
  <path d="M300,250 L600,250" stroke="#58a6ff" stroke-width="3" marker-end="url(#a)"/>
  <text x="450" y="240" text-anchor="middle" fill="#58a6ff">3. do it, paste what happened</text>
  <text x="450" y="285" text-anchor="middle" fill="#8b949e" font-size="16">repeat until it says “Handover is ready”  ·  congratulations, you’re now a developeeeeer</text>
</svg>
