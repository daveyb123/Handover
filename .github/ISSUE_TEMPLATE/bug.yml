name: Bug
description: Something the scripts or instructions did wrong.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or phrase and the exact output, with business details removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Engine version
      description: The contents of .agent/VERSION
      placeholder: "0.2.0"
  - type: input
    id: platform
    attributes:
      label: Platform and CLI
      placeholder: macOS 15, Claude Code 2.1
